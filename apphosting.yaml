# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1

env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://www.hispaniolapay.com/
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_INSTAGRAM_HANDLE
    value: "@hispaniolapay"
    availability:
      - BUILD
      - RUNTIME
  - variable: WHATSAPP_GRAPH_API_VERSION
    value: v24.0
    availability:
      - RUNTIME
  - variable: WHATSAPP_WEBHOOK_PUBLIC_URL
    value: https://hispaniola--studio-4779362907-870c5.us-east4.hosted.app/api/whatsapp/webhook
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_WHATSAPP_WEBHOOK_URL
    value: https://hispaniola--studio-4779362907-870c5.us-east4.hosted.app/api/whatsapp/webhook
    availability:
      - BUILD
      - RUNTIME

# Antes de habilitar integraciones externas, configure sus claves mediante
# Secret Manager y referencias `secret:` en este archivo. Nunca incluya las
# claves directamente en el código ni en este archivo.
