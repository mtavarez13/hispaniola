name: HispaniolaPay
options:
  bundleIdPrefix: com.hispaniolapay
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: 1.2.0
    CURRENT_PROJECT_VERSION: 3
targets:
  HispaniolaPay:
    type: application
    platform: iOS
    sources:
      - HispaniolaPay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hispaniolapay.mobile.ios
        INFOPLIST_FILE: HispaniolaPay/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
